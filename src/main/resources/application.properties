spring.application.name=demo

# --- Banco de dados --------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD: SENHA DO BANCO DE DADOS}  - # INSIRA A SENHA DO BANCO DE DADOS
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialeto explicito para o Hibernate nao falhar ao tentar detectar via JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Equivalente ao hibernate.hbm2ddl.auto=update do persistence.xml original.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Sessao ------------------------------------------------------------
server.servlet.session.timeout=30m

# --- Senha de privilegios ----------------------------------------------
# Segredo separado da senha de login de qualquer conta - exigido para
# promover/rebaixar alguem a administrador (ver PrivilegioService). Troque
# isto (ou defina a variavel de ambiente SENHA_PRIVILEGIOS) antes de usar
# em qualquer ambiente real; o valor abaixo e so um placeholder de
# desenvolvimento, do mesmo jeito que DB_PASSWORD acima.
app.seguranca.senha-privilegios=${SENHA_PRIVILEGIOS: CRIE A SENHA DO PRIVILEGIO}  # CRIE UMA SENHA DE PRIVILEGIO

